name: Pre-release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run Gradle
      run: |
        ./gradlew assemblePrereleaseRelease
        cp app/build/outputs/apk/prerelease/release/*.apk app/build/outputs/apk/prerelease/release/novastream-prerelease.apk

    - name: Create pre-release
      uses: softprops/action-gh-release@v2
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        tag_name: "pre-release"
        name: "NovaStream Pre-release"
        prerelease: true
        draft: false
        generate_release_notes: false
        body: "Automated NovaStream build with independent identity and custom integrations."
        files: |
          app/build/outputs/apk/prerelease/release/novastream-prerelease.apk
